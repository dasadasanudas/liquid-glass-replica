name: Value Sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/parameters.js'
      - 'scripts/extract-values.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/value-sweep.yml'

jobs:
  extract-values:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate inferred value sweep
        run: npm run extract:values

      - name: Upload value sweep artifact
        uses: actions/upload-artifact@v4
        with:
          name: inferred-value-sweep
          path: artifacts/inferred-value-sweep.json
