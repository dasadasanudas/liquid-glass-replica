<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Replica Baseline</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <canvas id="gl-canvas"></canvas>
    <div id="panel-hitbox" aria-label="Glass panel drag surface">
      <div class="resize-handle" aria-label="Resize panel"></div>
    </div>

    <aside id="controls">
      <h1>Liquid Glass Replica</h1>
      <label>Theme
        <select id="theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label>Style
        <select id="style">
          <option value="regular">Regular</option>
          <option value="clear">Clear</option>
          <option value="subdued">Subdued</option>
        </select>
      </label>
      <label><input type="checkbox" id="reduceTransparency" /> Reduce Transparency</label>
      <label><input type="checkbox" id="increaseContrast" /> Increase Contrast</label>
      <label>Corner radius
        <input id="radius" type="range" min="12" max="48" step="1" />
      </label>
      <label>Blur radius (inferred)
        <input id="blurRadius" type="range" min="1" max="12" step="0.1" />
      </label>
      <label>Shadow amount
        <input id="shadowAmount" type="range" min="0" max="120" step="1" />
      </label>
      <p class="note">Measured values are marked in code comments. Sliders tagged “inferred” are CPU-side approximations.</p>
    </aside>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
